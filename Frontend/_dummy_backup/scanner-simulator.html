<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Scanner Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        .lcd-text { font-family: 'VT323', monospace; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4 selection:bg-teal-500 selection:text-white">

    <div class="bg-slate-800 p-6 md:p-8 rounded-3xl shadow-2xl w-full max-w-sm border-8 border-slate-700 relative">
        
        <div class="absolute top-4 right-5 w-3 h-3 bg-red-500 rounded-full animate-pulse shadow-[0_0_10px_red]"></div>

        <h2 class="text-slate-400 text-center font-bold tracking-widest text-sm mb-6 uppercase">ESP32 Barcode Simulator</h2>

        <div class="bg-emerald-400 p-4 rounded-lg mb-8 shadow-inner border-4 border-slate-900 h-24 flex flex-col justify-center relative overflow-hidden">
            <div class="absolute inset-0 opacity-10 bg-[repeating-linear-gradient(transparent,transparent_2px,#000_2px,#000_4px)]"></div>
            
            <div id="lcd1" class="lcd-text text-2xl text-slate-900 font-bold uppercase leading-none mb-1 relative z-10 truncate">SYSTEM READY</div>
            <div id="lcd2" class="lcd-text text-xl text-slate-800 font-bold uppercase leading-none relative z-10 truncate">MODE: IN (RESTOCK)</div>
        </div>

        <div class="bg-slate-900 p-2 rounded-xl flex gap-2 mb-6 border-2 border-slate-700">
            <button id="btnIN" onclick="setMode('IN')" class="flex-1 py-3 rounded-lg font-extrabold text-sm transition bg-teal-500 text-slate-900 shadow-[0_0_15px_rgba(20,184,166,0.5)]">MODE IN (MASUK)</button>
            <button id="btnOUT" onclick="setMode('OUT')" class="flex-1 py-3 rounded-lg font-bold text-sm transition bg-transparent text-slate-500 hover:text-white">MODE OUT (KELUAR)</button>
        </div>

        <div class="mb-6">
            <label class="block text-slate-500 text-xs font-bold uppercase mb-2">Input Barcode Fisik</label>
            <input type="text" id="barcodeInput" placeholder="Ketik barcode di sini..." onkeyup="checkEnter(event)" class="w-full bg-slate-900 border-2 border-slate-700 text-white p-4 rounded-xl font-mono text-center text-lg focus:border-teal-500 focus:ring-1 focus:ring-teal-500 outline-none transition" autocomplete="off" autofocus>
        </div>

        <button onclick="doScan()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-extrabold py-5 rounded-xl text-xl shadow-[0_8px_0_#9f1239] active:shadow-[0_0px_0_#9f1239] active:translate-y-2 transition-all flex items-center justify-center gap-3">
            <span class="text-2xl">📡</span> TEMBAK SCANNER
        </button>

    </div>

    <script>
        // Sesuaikan dengan URL Backend kamu
        const API_URL = 'http://localhost:3000/api/scanner'; 
        
        // SAMAKAN DENGAN ISI FILE .env DI NODE.JS KAMU
        const API_KEY_SECRET = 'akusukafurrysolid3x'; 
        
        let currentMode = 'IN';

        // DOM Elements
        const lcd1 = document.getElementById('lcd1');
        const lcd2 = document.getElementById('lcd2');
        const btnIN = document.getElementById('btnIN');
        const btnOUT = document.getElementById('btnOUT');
        const barcodeInput = document.getElementById('barcodeInput');

        // Fungsi mengubah Mode IN / OUT
        function setMode(mode) {
            currentMode = mode;
            
            if (mode === 'IN') {
                btnIN.className = 'flex-1 py-3 rounded-lg font-extrabold text-sm transition bg-teal-500 text-slate-900 shadow-[0_0_15px_rgba(20,184,166,0.5)]';
                btnOUT.className = 'flex-1 py-3 rounded-lg font-bold text-sm transition bg-transparent text-slate-500 hover:text-white';
                updateLCD('MODE GANTI:', 'IN (RESTOCK)');
            } else {
                btnOUT.className = 'flex-1 py-3 rounded-lg font-extrabold text-sm transition bg-amber-500 text-slate-900 shadow-[0_0_15px_rgba(245,158,11,0.5)]';
                btnIN.className = 'flex-1 py-3 rounded-lg font-bold text-sm transition bg-transparent text-slate-500 hover:text-white';
                updateLCD('MODE GANTI:', 'OUT (AMBIL)');
            }
            
            barcodeInput.focus();
        }

        // Fungsi Update Layar LCD
        function updateLCD(line1, line2) {
            lcd1.innerText = line1 || '';
            lcd2.innerText = line2 || '';
        }

        // Trigger scan jika pencet Enter di keyboard
        function checkEnter(event) {
            if (event.key === 'Enter') {
                doScan();
            }
        }

        // Fungsi Tembak API
        async function doScan() {
            const code = barcodeInput.value.trim();
            
            if (!code) {
                updateLCD('ERROR:', 'BARCODE KOSONG!');
                return;
            }

            updateLCD('SCANNING...', 'WAIT...');

            try {
                // ==========================================
                // PERBAIKAN: Menyelipkan Header x-api-key
                // ==========================================
                const response = await axios.post(API_URL, {
                    code: code,
                    mode: currentMode
                }, {
                    headers: {
                        'x-api-key': API_KEY_SECRET
                    }
                });

                // Tampilkan hasil response dari backend ke LCD
                const data = response.data;
                updateLCD(data.lcd_line_1, data.lcd_line_2);

            } catch (error) {
                // Tangkap error 400/401/500 dari backend
                if (error.response && error.response.data) {
                    const errData = error.response.data;
                    updateLCD(errData.lcd_line_1 || 'SYSTEM ERROR', errData.lcd_line_2 || 'CEK SERVER');
                } else {
                    updateLCD('KONEKSI GAGAL', 'API MATI?');
                }
            } finally {
                // Bersihkan input siap untuk tembakan berikutnya
                barcodeInput.value = '';
                barcodeInput.focus();
            }
        }
    </script>
</body>
</html>
